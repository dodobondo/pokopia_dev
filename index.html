<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ぽこポケ世代別図鑑</title>
    <meta
      name="description"
      content="ぽこあポケモンに登場するポケモンを、初登場した世代（赤緑〜SV）ごとに画像つきでまとめた非公式の一覧です。"
    />
    <style>
      :root {
        --ball-red: #ee2a2a;
        --ball-red-dark: #b81c1c;
        --ink: #262626;
        --panel: #fffdf8;
        --bg: #fff3e6;
        --text: #2c2c2c;
        --muted: #7a6f68;
        --border: rgba(38, 38, 38, 0.14);
        --card-hover: #fff6ec;
        --dot-a: rgba(238, 42, 42, 0.06);
        --dot-b: rgba(38, 38, 38, 0.045);
        --dlc: #1f7fbf;
        --event: #c98a00;
        --link: #b81c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ink: #f1ebe4;
          --panel: #221e1c;
          --bg: #171412;
          --text: #ece6df;
          --muted: #a89d95;
          --border: rgba(241, 235, 228, 0.16);
          --card-hover: #2c2624;
          --dot-a: rgba(238, 42, 42, 0.08);
          --dot-b: rgba(255, 255, 255, 0.035);
          --dlc: #5bb4ea;
          --event: #e6b43c;
          --link: #ff8a80;
        }
      }
      :root[data-theme="dark"] {
        --ink: #f1ebe4;
        --panel: #221e1c;
        --bg: #171412;
        --text: #ece6df;
        --muted: #a89d95;
        --border: rgba(241, 235, 228, 0.16);
        --card-hover: #2c2624;
        --dot-a: rgba(238, 42, 42, 0.08);
        --dot-b: rgba(255, 255, 255, 0.035);
        --dlc: #5bb4ea;
        --event: #e6b43c;
        --link: #ff8a80;
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background:
          radial-gradient(var(--dot-a) 8%, transparent 9%),
          radial-gradient(var(--dot-b) 8%, transparent 9%), var(--bg);
        background-position:
          0 0,
          30px 30px;
        background-size: 60px 60px;
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
        line-height: 1.5;
      }
      .wrap {
        width: min(1100px, 100%);
        margin: 0 auto;
        padding: 28px 16px 40px;
      }

      header {
        text-align: center;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 40px);
        font-weight: 900;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--panel);
        border: 2px solid var(--ink);
        border-radius: 20px;
        padding: 12px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(38, 20, 10, 0.12);
      }
      .gen-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .gen-nav a {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        padding: 6px 12px;
        border: 2px solid var(--border);
        border-radius: 999px;
        color: var(--ink);
        text-decoration: none;
        font-weight: 800;
        font-size: 14px;
      }
      .gen-nav a:hover {
        border-color: var(--ball-red);
      }
      .gen-nav small {
        color: var(--muted);
        font-weight: 700;
        font-size: 12px;
      }
      .search-row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      input[type="search"] {
        flex: 1 1 220px;
        min-width: 0;
        height: 42px;
        padding: 0 14px;
        border: 2px solid var(--border);
        border-radius: 14px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 16px;
        outline: none;
      }
      input[type="search"]:focus {
        border-color: var(--ball-red);
      }
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
      }
      .filters label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        cursor: pointer;
      }
      .hit {
        font-size: 13px;
        color: var(--muted);
      }

      section.gen {
        background: var(--panel);
        border: 2px solid var(--ink);
        border-radius: 24px;
        overflow: hidden;
        margin-bottom: 22px;
        scroll-margin-top: 150px;
      }
      .gen-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 12px 18px;
        background: linear-gradient(
          to bottom,
          var(--ball-red),
          var(--ball-red-dark)
        );
        border-bottom: 2px solid var(--ink);
        color: #fff;
      }
      .gen-head h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 900;
      }
      .gen-head span {
        font-size: 14px;
        font-weight: 700;
        opacity: 0.92;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
        gap: 8px;
        padding: 14px;
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 6px 10px;
        border: 2px solid var(--border);
        border-radius: 16px;
        text-align: center;
        color: inherit;
        text-decoration: none;
        transition:
          border-color 0.15s,
          background 0.15s,
          transform 0.15s;
      }
      a.card:hover {
        border-color: var(--ball-red);
        background: var(--card-hover);
        transform: translateY(-2px);
      }
      .card img {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }
      .card img.broken {
        visibility: hidden;
      }
      .no {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .name {
        font-size: 14px;
        font-weight: 800;
        color: var(--link);
        word-break: break-all;
      }
      .badge {
        position: absolute;
        top: 6px;
        right: 6px;
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 800;
        color: #fff;
      }
      .badge.dlc {
        background: var(--dlc);
      }
      .badge.event {
        background: var(--event);
      }
      .empty {
        padding: 30px;
        text-align: center;
        color: var(--muted);
      }

      footer {
        margin-top: 28px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      footer a {
        color: var(--link);
      }
      footer p {
        margin: 4px 0;
      }

      @media (max-width: 480px) {
        .grid {
          grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
          gap: 6px;
          padding: 10px;
        }
        .card img {
          width: 72px;
          height: 72px;
        }
        .name {
          font-size: 13px;
        }
        .toolbar {
          position: static;
        }
        section.gen {
          scroll-margin-top: 10px;
        }
      }
    </style>
  </head>

      const SEC = ["本編", "DLC", "イベント"];
      const BASE = "https://gamewith.jp/pocoapokemon/";

      const toKata = (s) =>
        s.replace(/[ぁ-ゖ]/g, (c) =>
          String.fromCharCode(c.charCodeAt(0) + 0x60),
        );
      const esc = (s) =>
        s.replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      const baseName = (n) =>
        n.replace(/\(.*\)/, "").replace(/^パルデア|^ステレオ/, "");
      const countSpecies = (list) =>
        new Set(list.map((d) => baseName(d.n))).size;

      function card(d) {
        const badge =
          d.s === 1
            ? '<span class="badge dlc">DLC</span>'
            : d.s === 2
              ? '<span class="badge event">イベント</span>'
              : "";
        const no =
          (d.s === 0 ? "No." : d.s === 1 ? "うみぞこ " : "イベ.") + d.no;
        const inner =
          badge +
          `<img src="${esc(d.img)}" alt="" width="88" height="88" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('broken')">` +
          `<span class="no">${no}</span><span class="name">${esc(d.n)}</span>`;
        return d.aid
          ? `<a class="card" href="${BASE}${d.aid}" target="_blank" rel="noopener">${inner}</a>`
          : `<div class="card">${inner}</div>`;
      }

      const list = document.getElementById("list");
      const nav = document.getElementById("genNav");
      const q = document.getElementById("q");
      const checks = [...document.querySelectorAll(".filters input")];

      document.getElementById("summary").textContent =
        `全${countSpecies(DATA)}種（姿違いを含め${DATA.length}件）・本編／DLC第1弾／イベント図鑑`;

      function render() {
        const raw = q.value.trim();
        const term = toKata(raw);
        const on = new Set(
          checks.filter((c) => c.checked).map((c) => +c.dataset.s),
        );
        const shown = DATA.filter(
          (d) =>
            on.has(d.s) && (!raw || d.n.includes(raw) || d.n.includes(term)),
        );
        let html = "";
        let navHtml = "";
        GENS.forEach((g, i) => {
          const items = shown.filter((d) => d.g === i);

          const n = countSpecies(items);

        document.getElementById("hit").textContent =
          shown.length === DATA.length ? "" : `${shown.length}件表示中`;
